AWSTemplateFormatVersion: '2010-09-09'
Description: |
  [Data Engineering Project] 
  Multi-AZ (2 AZs) 3-Tier VPC Infrastructure.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. Project & Team Information"
        Parameters:
          - ServiceName
          - TeamNumber
      - Label:
          default: "2. Network Configuration (Create or Select)"
        Parameters:
          - ExistingVpcId
          - VPCCidr
      - Label:
          default: "3. Advanced Network Sizing"
        Parameters:
          - TeamChunkCount
          - TeamMaskBits
          - AppSubnetMaskBits
          - PublicDBSubnetMaskBits
          - AppSubnetCount
          - PublicDBSubnetCount
    ParameterLabels:
      # (기존 라벨들 뒤에 추가)
      ServiceName: { default: "Service Name" }
      TeamNumber: { default: "Team Number" }
      ExistingVpcId: { default: "Existing VPC ID (Optional)" }
      VPCCidr: { default: "VPC CIDR Block" }
      TeamChunkCount: { default: "Team Chunk Count" }
      TeamMaskBits: { default: "Team Mask Bits" }
      AppSubnetMaskBits: { default: "App Subnet Mask Bits" }
      PublicDBSubnetMaskBits: { default: "Public/DB Subnet Mask Bits" }
      AppSubnetCount: { default: "App Subnet Count" }
      PublicDBSubnetCount: { default: "Public/DB Subnet Count" }

Parameters:
  ServiceName:
    Type: String
    Default: "data-pipeline"
    Description: "Name of the service/project."

  TeamNumber:
    Type: Number
    Default: 1
    Description: "Team ID (1, 2, 3...). Used to calculate non-overlapping CIDR blocks."

  ExistingVpcId:
    Type: String
    Default: ""
    Description: "Optional: Enter an existing VPC ID to reuse. If left blank, a new VPC will be created."

  VPCCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: "CIDR block for the new VPC. (e.g., 10.0.0.0/20)"
  
  # --- [네트워크 사이징 파라미터] ---
# 1. 팀당 할당량 설정 (이미지 전체 크기: /20)
# --- [Advanced Network Sizing Parameters] ---
  TeamChunkCount:
    Type: Number
    Default: 16
    Description: "Number of team chunks to divide the /16 VPC."

  TeamMaskBits:
    Type: Number
    Default: 12
    Description: "Bits to subtract from 32 to get a /20 per team."

  AppSubnetMaskBits:
    Type: Number
    Default: 10
    Description: "Bits to subtract from 32 to get a /22 for App subnets."

  PublicDBSubnetMaskBits:
    Type: Number
    Default: 8
    Description: "Bits to subtract from 32 to get a /24 for Public/DB subnets."

  AppSubnetCount:
    Type: Number
    Default: 4
    Description: "Number of /22 slots available within a /20 block."

  PublicDBSubnetCount:
    Type: Number
    Default: 16
    Description: "Number of /24 slots available within a /20 block."

Conditions:
  # Check if a new VPC should be created [cite: 2026-02-14]
  CreateNewVPC: !Equals [ !Ref ExistingVpcId, "" ] # 빈칸이면 vpc 생성
  

Resources:
  # =========================================================
  # 1. 공용 네트워크 리소스 (VPC, IGW)
  # =========================================================
  MainVPC:
    Type: AWS::EC2::VPC
    Condition: CreateNewVPC
    Properties:
      CidrBlock: !Ref VPCCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNewVPC
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-igw" }]

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref MainVPC
      InternetGatewayId: !Ref InternetGateway

  # =========================================================
  # 2. NAT Gateway (Public 영역에 위치하여 Private 통신 지원)
  # 비용 최적화를 위해 NAT는 AZ-a에 1개만 생성 (운영 환경은 AZ별 생성이 정석)
  # =========================================================
  # AZ-a용 NAT 및 IP
  NatEIPA:
    Type: AWS::EC2::EIP
    Condition: CreateNewVPC # 새로 만들 때만 생성
    DependsOn: AttachGateway # 이제 단순 문자열로 써도 에러가 안 나!
    Properties: { Domain: vpc }

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Condition: CreateNewVPC # 이것도 세트로 묶어줘
    Properties:
      AllocationId: !GetAtt NatEIPA.AllocationId
      SubnetId: !Ref TeamPublicSubnetA
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-nat-a" }]
  
  # AZ-b용 NAT 및 IP
  NatEIPB:
    Type: AWS::EC2::EIP
    Condition: CreateNewVPC
    DependsOn: AttachGateway
    Properties: { Domain: vpc }

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: CreateNewVPC
    Properties:
      AllocationId: !GetAtt NatEIPB.AllocationId
      SubnetId: !Ref TeamPublicSubnetB
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-nat-b" }]

  # =========================================================
  # 3. Public Subnets (가용영역 A, B 대칭 배치)
  # 외부 로드밸런서(ALB)가 배치될 구역
  # =========================================================
  # Public Subnet A (팀 대역 내의 특정 지점부터 /26 쪼개기)
  TeamPublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      # 팀 /20 대역 중 0번째 /24 조각
      CidrBlock: !Select [ 0, !Cidr [ !Select [ !Ref TeamNumber, !Cidr [ !Ref VPCCidr, 16, 12 ] ], 16, 8 ] ]
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-team-${TeamNumber}-pub-a"
        - Key: "kubernetes.io/role/elb"
          Value: "1"

  TeamPublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      # 팀 /20 대역 중 1번째 /24 조각
      CidrBlock: !Select [ 1, !Cidr [ !Select [ !Ref TeamNumber, !Cidr [ !Ref VPCCidr, 16, 12 ] ], 16, 8 ] ]
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-team-${TeamNumber}-pub-b"
        - Key: "kubernetes.io/role/elb"
          Value: "1"

  # =========================================================
  # 4. App Private Subnets (가용영역 A, B 대칭 배치)
  # EKS 워커 노드 및 데이터 처리 엔진이 실행될 핵심 구역
  # =========================================================
  TeamAppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      # 팀 /20 대역 중 1번째 /22 조각 (이미지에서 .4.0 지점)
      CidrBlock: !Select [ 1, !Cidr [ !Select [ !Ref TeamNumber, !Cidr [ !Ref VPCCidr, 16, 12 ] ], 4, 10 ] ]
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-team-${TeamNumber}-app-a"
        - Key: "kubernetes.io/role/internal-elb"
          Value: "1"
        - Key: "karpenter.sh/discovery"
          Value: !Sub "${ServiceName}-team-${TeamNumber}-cluster"

  TeamAppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      # 팀 /20 대역 중 2번째 /22 조각 (이미지에서 .8.0 지점)
      CidrBlock: !Select [ 2, !Cidr [ !Select [ !Ref TeamNumber, !Cidr [ !Ref VPCCidr, 16, 12 ] ], 4, 10 ] ]
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-team-${TeamNumber}-app-b"
        - Key: "kubernetes.io/role/internal-elb"
          Value: "1"
        - Key: "karpenter.sh/discovery"
          Value: !Sub "${ServiceName}-team-${TeamNumber}-cluster"

  # =========================================================
  # 5. DB Private Subnets (가용영역 A, B 대칭 배치)
  # 데이터 저장소(RDS 등)가 위치할 보안 최상위 구역
  # =========================================================
  # DB Subnets (인덱스 10, 11 사용)
  TeamDBSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      # 팀 /20 대역 중 12번째 /24 조각 (이미지에서 .12.0 지점)
      CidrBlock: !Select [ 12, !Cidr [ !Select [ !Ref TeamNumber, !Cidr [ !Ref VPCCidr, 16, 12 ] ], 16, 8 ] ]
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-team-${TeamNumber}-db-a"

  TeamDBSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      # 팀 /20 대역 중 13번째 /24 조각 (이미지에서 .13.0 지점)
      CidrBlock: !Select [ 13, !Cidr [ !Select [ !Ref TeamNumber, !Cidr [ !Ref VPCCidr, 16, 12 ] ], 16, 8 ] ]
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-team-${TeamNumber}-db-b"

  # =========================================================
  # 6. 라우팅 및 연결 설정
  # =========================================================
  # Public은 IGW 하나를 공유하므로 기존과 동일
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-pub-rt" }]

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNewVPC
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # --- [Private A용 라우팅: NAT-A 사용] ---
  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-priv-rt-a" }]

  PrivateNatRouteA:
    Type: AWS::EC2::Route
    Condition: CreateNewVPC
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  # DB 전용 라우팅 테이블 (NAT 경로 없음)
  DBRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-db-rt-a" }]

  DBRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-db-rt-b" }]

  # --- [Private B용 라우팅: NAT-B 사용] ---
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !If [ CreateNewVPC, !Ref MainVPC, !Ref ExistingVpcId ]
      Tags: [{ Key: Name, Value: !Sub "${ServiceName}-team-${TeamNumber}-priv-rt-b" }]

  PrivateNatRouteB:
    Type: AWS::EC2::Route
    Condition: CreateNewVPC
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  # =========================================================
  # 7. 서브넷-라우팅 테이블 연결 (대칭 연결)
  # =========================================================

  # Public 연결
  PubAssocA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref TeamPublicSubnetA, RouteTableId: !Ref PublicRouteTable } }
  PubAssocB: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref TeamPublicSubnetB, RouteTableId: !Ref PublicRouteTable } }

  # Private A 계층 연결 (App-a는 NAT 사용, DB-a는 Isolated)
  AppAssocA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref TeamAppSubnetA, RouteTableId: !Ref PrivateRouteTableA } }
  DBAssocA: 
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: 
      SubnetId: !Ref TeamDBSubnetA
      RouteTableId: !Ref DBRouteTableA

  # Private B 계층 연결 (App-b는 NAT 사용, DB-b는 Isolated)
  AppAssocB: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref TeamAppSubnetB, RouteTableId: !Ref PrivateRouteTableB } }
  DBAssocB: 
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: 
      SubnetId: !Ref TeamDBSubnetB
      RouteTableId: !Ref DBRouteTableB

  # 변수 값 할당
Outputs:
  # 1. VPC ID
  ExportVpcId:
    Condition: CreateNewVPC # 새로 만들 때만 이 Output을 활성화
    Value: !Ref MainVPC
    Export:
      Name: !Sub "${ServiceName}-team-${TeamNumber}-vpc"

  # 2. Public Subnets (이름 형식: 서비스-team-번호-pub-a)
  ExportPublicSubnetA:
    Value: !Ref TeamPublicSubnetA
    Export:
      Name: !Sub "${ServiceName}-team-${TeamNumber}-pub-a"
  ExportPublicSubnetB:
    Value: !Ref TeamPublicSubnetB
    Export:
      Name: !Sub "${ServiceName}-team-${TeamNumber}-pub-b"

  # 3. App Private Subnets (이름 형식: 서비스-team-번호-app-a)
  ExportAppSubnetA:
    Value: !Ref TeamAppSubnetA
    Export:
      Name: !Sub "${ServiceName}-team-${TeamNumber}-app-a"
  ExportAppSubnetB:
    Value: !Ref TeamAppSubnetB
    Export:
      Name: !Sub "${ServiceName}-team-${TeamNumber}-app-b"

  # --- [추가된 부분: RDS 스크립트 연동용] --- [cite: 2026-04-04]
  ExportDBSubnetA:
    Value: !Ref TeamDBSubnetA
    Export:
      Name: !Sub "${ServiceName}-team-${TeamNumber}-db-a"
  ExportDBSubnetB:
    Value: !Ref TeamDBSubnetB
    Export:
      Name: !Sub "${ServiceName}-team-${TeamNumber}-db-b"

  # 4. 서비스 정보 (순수 값만 추출하기 위한 통로) [cite: 2026-02-14]
  ExportServiceName:
    Value: !Ref ServiceName
    Export:
      Name: !Sub "${ServiceName}-service-name" 

  ExportTeamNumber:
    Value: !Ref TeamNumber
    Export:
      Name: !Sub "${ServiceName}-team-number"
